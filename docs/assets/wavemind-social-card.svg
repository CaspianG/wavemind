<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">WaveMind verified experience for AI agents</title>
  <desc id="desc">A diagram showing how WaveMind captures agent work, verifies outcomes, promotes bounded procedures, and returns cited Experience Packets.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .font { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .title { font-size: 64px; font-weight: 850; fill: #050505; }
      .subtitle { font-size: 24px; fill: #222222; }
      .label { font-size: 15px; font-weight: 800; fill: #050505; letter-spacing: 1px; }
      .boxTitle { font-size: 25px; font-weight: 800; fill: #050505; }
      .boxText { font-size: 17px; fill: #333333; }
      .small { font-size: 14px; fill: #333333; }
      .tiny { font-size: 12px; fill: #444444; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; }
      .chip { fill: #ffffff; stroke: #111111; stroke-width: 1.6; }
      .line { stroke: #111111; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #111111; stroke-width: 1.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="36" y="34" width="1128" height="562" rx="18" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <g class="font">
    <text class="title" x="72" y="110">WaveMind</text>
    <text class="subtitle" x="76" y="150">Agents learn from independently verified work, not from raw history.</text>
  </g>

  <g class="font" transform="translate(74 205)">
    <text class="label" x="0" y="-22">THE VERIFIED EXPERIENCE LOOP</text>

    <rect class="box" x="0" y="0" width="210" height="170" rx="12"/>
    <text class="boxTitle" x="28" y="44">1. Capture</text>
    <text class="boxText" x="28" y="78">Trace, tool call,</text>
    <text class="boxText" x="28" y="104">environment, and</text>
    <text class="boxText" x="28" y="130">observed outcome.</text>

    <line class="line" x1="230" y1="85" x2="260" y2="85" marker-end="url(#arrow)"/>

    <rect class="box" x="285" y="0" width="210" height="170" rx="12"/>
    <text class="boxTitle" x="313" y="44">2. Verify</text>
    <text class="boxText" x="313" y="78">Independent test,</text>
    <text class="boxText" x="313" y="104">tool, operator, or</text>
    <text class="boxText" x="313" y="130">downstream state.</text>

    <line class="line" x1="515" y1="85" x2="545" y2="85" marker-end="url(#arrow)"/>

    <rect class="box" x="570" y="0" width="210" height="170" rx="12"/>
    <text class="boxTitle" x="598" y="44">3. Promote</text>
    <text class="boxText" x="598" y="78">Keep in shadow</text>
    <text class="boxText" x="598" y="104">until repeat proof</text>
    <text class="boxText" x="598" y="130">earns bounded reuse.</text>

    <line class="line" x1="800" y1="85" x2="830" y2="85" marker-end="url(#arrow)"/>

    <rect class="box" x="855" y="0" width="210" height="170" rx="12"/>
    <text class="boxTitle" x="883" y="44">4. Reuse</text>
    <text class="boxText" x="883" y="78">Return a cited</text>
    <text class="boxText" x="883" y="104">Experience Packet</text>
    <text class="boxText" x="883" y="130">or stay silent.</text>
  </g>

  <g class="font" transform="translate(74 425)">
    <text class="label" x="0" y="-24">WHAT EVERY PACKET CARRIES</text>

    <rect class="chip" x="0" y="0" width="160" height="58" rx="10"/>
    <circle cx="28" cy="29" r="8" fill="#111111"/>
    <text class="small" x="50" y="24" font-weight="800">provenance</text>
    <text class="tiny" x="50" y="43">source attached</text>

    <rect class="chip" x="180" y="0" width="160" height="58" rx="10"/>
    <circle cx="208" cy="29" r="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <text class="small" x="230" y="24" font-weight="800">evidence</text>
    <text class="tiny" x="230" y="43">outcome checked</text>

    <rect class="chip" x="360" y="0" width="160" height="58" rx="10"/>
    <path class="thin" d="M388 18 V40 M378 28 H398"/>
    <text class="small" x="410" y="24" font-weight="800">scope</text>
    <text class="tiny" x="410" y="43">bounded reuse</text>

    <rect class="chip" x="540" y="0" width="180" height="58" rx="10"/>
    <path class="thin" d="M568 20 L586 38 M586 20 L568 38"/>
    <text class="small" x="608" y="24" font-weight="800">correction</text>
    <text class="tiny" x="608" y="43">conflicts resolved</text>

    <rect class="chip" x="740" y="0" width="180" height="58" rx="10"/>
    <path class="thin" d="M768 34 C778 16 798 16 808 34"/>
    <text class="small" x="830" y="24" font-weight="800">rollback</text>
    <text class="tiny" x="830" y="43">safe way out</text>

    <rect class="chip" x="940" y="0" width="125" height="58" rx="10"/>
    <rect x="968" y="19" width="18" height="18" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <text class="small" x="1000" y="24" font-weight="800">audit</text>
    <text class="tiny" x="1000" y="43">history kept</text>
  </g>

  <g class="font" transform="translate(74 540)">
    <line class="thin" x1="0" y1="0" x2="1065" y2="0"/>
    <text class="small" x="0" y="34">Local-first · provider-neutral · evidence-gated · inspectable · reversible · MIT licensed</text>
  </g>
</svg>
