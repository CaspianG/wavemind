<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="owned-memory-loop-en-title owned-memory-loop-en-desc">
<title id="owned-memory-loop-en-title">WaveMind: memory between tasks</title>
<desc id="owned-memory-loop-en-desc">Context and a receipt precede an external action; its outcome is recorded and verified, and the next request rechecks permissions, freshness and procedure eligibility.</desc>
