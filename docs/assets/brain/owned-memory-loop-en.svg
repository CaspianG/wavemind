<g data-station="1">
<rect x="536" y="104" width="208" height="64" rx="8" fill="#f5f5f5"/>
<rect x="536" y="104" width="208" height="64" rx="8" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<text class="node-name" x="640" y="132" text-anchor="middle">Collect task context</text>
<text class="node-copy" x="640" y="152" text-anchor="middle">Citations and open questions</text>
</g>
<g data-station="2">
<rect x="728" y="216" width="208" height="64" rx="8" fill="#f5f5f5"/>
<rect x="728" y="216" width="208" height="64" rx="8" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<text class="node-name" x="832" y="244" text-anchor="middle">Create an action receipt</text>
<text class="node-copy" x="832" y="264" text-anchor="middle">Before the agent acts</text>
</g>
<g data-station="3">
<rect x="728" y="440" width="208" height="64" rx="8" fill="#f5f5f5"/>
<rect x="728" y="440" width="208" height="64" rx="8" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<text class="node-name" x="832" y="468" text-anchor="middle">Carry out the action</text>
<text class="node-copy" x="832" y="488" text-anchor="middle">In your external AI client</text>
</g>
<g data-station="4">
<rect x="536" y="552" width="208" height="64" rx="8" fill="#f5f5f5"/>
<rect x="536" y="552" width="208" height="64" rx="8" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<text class="node-name" x="640" y="580" text-anchor="middle">Record the outcome</text>
<text class="node-copy" x="640" y="600" text-anchor="middle">Unverified at this point</text>
</g>
<g data-station="5">
<rect x="344" y="440" width="208" height="64" rx="8" fill="#f5f5f5"/>
<rect x="344" y="440" width="208" height="64" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
<text class="node-name" x="448" y="468" text-anchor="middle">Verify the result</text>
<text class="node-copy" x="448" y="488" text-anchor="middle">Owner or configured verifier</text>
</g>
<g data-station="6">
<rect x="344" y="216" width="208" height="64" rx="8" fill="#f5f5f5"/>
<rect x="344" y="216" width="208" height="64" rx="8" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<text class="node-name" x="448" y="244" text-anchor="middle">The next request</text>
<text class="node-copy" x="448" y="264" text-anchor="middle">Recheck eligibility</text>
</g>
<g data-hub="true">
<rect x="524" y="312" width="232" height="96" rx="8" fill="#2d3142"/>
<text class="hub-name" x="640" y="352" text-anchor="middle">Shared memory</text>
<text class="hub-copy" x="640" y="380" text-anchor="middle">Sources, decisions, history</text>
</g>
