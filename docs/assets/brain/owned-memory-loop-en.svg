<text class="legend" x="104" y="680">Work sequence</text>
<line x1="304" y1="676" x2="344" y2="676" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#owned-memory-loop-en-arrow-soft)"/>
<text class="legend" x="360" y="680">Written to memory</text>
<text class="legend" x="720" y="680">Actions and AI run outside WaveMind</text>
</svg>
