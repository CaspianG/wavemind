[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wavemind"
version = "2.10.0"
description = "Adaptive, local-first memory infrastructure for agents and applications"
readme = "README.md"
license = "MIT"
authors = [
  { name = "CaspianG" },
]
keywords = [
  "agent-memory",
  "ai-agents",
  "llm",
  "long-term-memory",
  "rag",
  "vector-search",
  "sqlite",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "fastapi>=0.140,<0.141",
  "uvicorn[standard]>=0.27",
  "pydantic>=2",
  "pypdf>=4",
]

[project.optional-dependencies]
sentence = [
  "sentence-transformers>=3",
]
ml = [
  "sentence-transformers>=3",
]
multimodal = [
  "sentence-transformers[image]>=5.1,<6",
  "transformers>=4.57,<6",
  "huggingface-hub>=0.34,<2",
  "torch>=2.1",
  "Pillow>=10",
  "opencv-python-headless>=4.10",
  "soundfile>=0.13",
  "trimesh>=4.8",
]
indexes = [
  "annoy>=1.17",
  "faiss-cpu>=1.8",
  "qdrant-client>=1.9",
]
postgres = [
  "psycopg[binary]>=3.1",
]
redis = [
  "redis>=5.0",
]
mcp = [
  "mcp>=1.28,<2",
]
s3 = [
  "boto3>=1.34",
]
otel = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
]
bench = [
  "chromadb>=1.0",
  "qdrant-client>=1.9",
  "zep-cloud>=3.23",
  "pyarrow>=15",
]
langchain = [
  "langchain-classic>=1.0",
]
providers = [
  "anthropic>=0.120,<1",
  "langgraph>=1.2,<2",
  "openai-agents>=0.19,<1",
]
production = [
  "annoy>=1.17",
  "faiss-cpu>=1.8",
  "qdrant-client>=1.9",
  "psycopg[binary]>=3.1",
  "redis>=5.0",
  "boto3>=1.34",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "httpx2>=2",
  "langchain-classic>=1.0",
  "mcp>=1.28,<2",
  "ruff==0.16.1",
]

[project.scripts]
wavemind = "wavemind.cli:main"
wavemind-mcp = "wavemind.mcp_server:main"

[project.urls]
Homepage = "https://github.com/CaspianG/wavemind"
Documentation = "https://github.com/CaspianG/wavemind/blob/main/docs/README.md"
Repository = "https://github.com/CaspianG/wavemind"
Changelog = "https://github.com/CaspianG/wavemind/blob/main/CHANGELOG.md"
Issues = "https://github.com/CaspianG/wavemind/issues"
Discussions = "https://github.com/CaspianG/wavemind/discussions"
Benchmarks = "https://caspiang.github.io/wavemind/"

[tool.setuptools.packages.find]
where = ["."]
include = ["wavemind*"]

[tool.setuptools.package-data]
wavemind = [
  "THIRD_PARTY_NOTICES.md",
  "licenses/*.txt",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"benchmarks/*.py" = ["E402"]
"examples/*.py" = ["E402"]
