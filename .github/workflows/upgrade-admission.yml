name: upgrade-admission

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: upgrade-admission-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upgrade-platform-matrix:
    name: upgrade (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install upgrade test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run bounded upgrade and admission tests
        # Keep the subprocess-heavy upgrade tests isolated from the admission
        # manifest checks. On Windows, carrying the full process state into the
        # second module can interrupt Git-for-Windows while it resolves HEAD.
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python benchmarks/pytest_exact_exit.py -q tests/test_upgrade.py
          python benchmarks/pytest_exact_exit.py -q tests/test_upgrade_admission.py

  exact-sha-upgrade-admission:
    needs: upgrade-platform-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install admission dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Build exact-SHA wheel and image
        run: |
          python -m build --wheel
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          WHEEL="$(find dist -maxdepth 1 -name 'wavemind-*.whl' -print -quit)"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "WHEEL=${WHEEL}" >> "$GITHUB_ENV"
          echo "WHEEL_SHA256=$(sha256sum "$WHEEL" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          docker build \
            --build-arg "WAVEMIND_VERSION=${VERSION}" \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --tag "wavemind:upgrade-${GITHUB_SHA}" \
            .

      - name: Run bounded operational failure matrix
        run: |
          python benchmarks/upgrade_operational_evidence.py \
            --output "${RUNNER_TEMP}/upgrade-operational.json"

      - name: Run real N-2 and N-1 Python package upgrades
        run: |
          python benchmarks/upgrade_python_cross_version.py \
            --candidate-wheel "$WHEEL" \
            --candidate-sha256 "$WHEEL_SHA256" \
            --source-version 2.10.0 \
            --source-version 2.11.0 \
            --work-root "${RUNNER_TEMP}/cross-version" \
            --output "${RUNNER_TEMP}/upgrade-cross-version.json"

      - name: Run real Docker Compose upgrade and rollback
        run: |
          python benchmarks/upgrade_docker_compose.py \
            --candidate-image "wavemind:upgrade-${GITHUB_SHA}" \
            --candidate-wheel "$WHEEL" \
            --candidate-sha256 "$WHEEL_SHA256" \
            --old-image ghcr.io/caspiang/wavemind:2.11.0 \
            --expected-source-sha "$GITHUB_SHA" \
            --work-root "${RUNNER_TEMP}/compose-upgrade" \
            --output "${RUNNER_TEMP}/upgrade-docker-compose.json"

      - name: Enforce exact-SHA upgrade admission
        run: |
          python benchmarks/upgrade_admission.py \
            --operational "${RUNNER_TEMP}/upgrade-operational.json" \
            --cross-version "${RUNNER_TEMP}/upgrade-cross-version.json" \
            --docker-compose "${RUNNER_TEMP}/upgrade-docker-compose.json" \
            --expected-source-sha "$GITHUB_SHA" \
            --output "${RUNNER_TEMP}/upgrade-admission.json" \
            --markdown-output "${RUNNER_TEMP}/UPGRADE_ADMISSION.md" \
            --require-admitted

      - name: Upload exact-SHA upgrade evidence
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-admission-${{ github.sha }}
          path: |
            ${{ runner.temp }}/upgrade-operational.json
            ${{ runner.temp }}/upgrade-cross-version.json
            ${{ runner.temp }}/upgrade-docker-compose.json
            ${{ runner.temp }}/upgrade-admission.json
            ${{ runner.temp }}/UPGRADE_ADMISSION.md
