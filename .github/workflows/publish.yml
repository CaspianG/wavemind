name: publish-existing-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to republish to PyPI
        required: true
        type: string

permissions:
  contents: read

jobs:
  pypi-recovery:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download the already-built GitHub release distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ inputs.tag }}" \
            --pattern "*.whl" \
            --pattern "*.tar.gz" \
            --dir dist

      - name: Verify downloaded distributions
        run: |
          python -m pip install --upgrade pip twine
          python -m twine check dist/*

      - name: Publish without rebuilding
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
