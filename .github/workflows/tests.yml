name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check wavemind tests benchmarks examples

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  python-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install compatibility dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run focused Python and CLI compatibility tests
        run: |
          pytest -q \
            tests/test_core_persistence.py \
            tests/test_cli_smoke.py::test_module_cli_remember_query_stats_and_backup \
            tests/test_cli_smoke.py::test_cli_version_prints_package_version \
            tests/test_onboarding.py::test_cli_init_and_doctor_json

  windows-install-cli:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package through the user-facing path
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run installed CLI smoke outside the checkout
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP
          $db = Join-Path $env:RUNNER_TEMP "wavemind-windows-smoke.sqlite3"
          $starter = Join-Path $env:RUNNER_TEMP "wavemind-windows-starter"
          wavemind --version
          wavemind --db $db remember "Windows CI installation smoke" --namespace ci
          wavemind --db $db query "installation smoke" --namespace ci
          wavemind --db $db stats --namespace ci
          python -m wavemind init $starter --template python --json
          python (Join-Path $starter "app.py")

  typescript-sdk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sdk/typescript

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install SDK dependencies
        run: npm ci

      - name: Build, test, pack, and install SDK
        run: npm test

  provider-contracts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install official provider SDKs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,providers]"
          npm ci --prefix sdk/typescript

      - name: Run official provider contract tests
        run: pytest -q tests/test_official_provider_contracts.py

      - name: Run strict integration admission
        run: |
          python -m wavemind integration-admission \
            --expected-source-sha "${GITHUB_SHA}" \
            --write-artifacts \
            --fail-on-blocked \
            --output integration_admission_results.json \
            --markdown-output INTEGRATION_ADMISSION.md

      - uses: actions/upload-artifact@v4
        with:
          name: integration-admission-${{ github.sha }}
          path: |
            integration_admission_results.json
            INTEGRATION_ADMISSION.md
