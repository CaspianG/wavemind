name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check wavemind tests benchmarks examples

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  typescript-sdk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sdk/typescript

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install SDK dependencies
        run: npm ci

      - name: Build, test, pack, and install SDK
        run: npm test

  provider-contracts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install official provider SDKs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,providers]"
          npm ci --prefix sdk/typescript

      - name: Run official provider contract tests
        run: pytest -q tests/test_official_provider_contracts.py

      - name: Run strict integration admission
        run: |
          python -m wavemind integration-admission \
            --expected-source-sha "${GITHUB_SHA}" \
            --write-artifacts \
            --fail-on-blocked \
            --output integration_admission_results.json \
            --markdown-output INTEGRATION_ADMISSION.md

      - uses: actions/upload-artifact@v7
        with:
          name: integration-admission-${{ github.sha }}
          path: |
            integration_admission_results.json
            INTEGRATION_ADMISSION.md
