name: product-site

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "benchmarks/*.json"
      - "benchmarks/*.md"
      - "docs/data/*.json"
      - "docs/assets/benchmark-summary.svg"
      - "docs/benchmark-dashboard.html"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "website/**"
      - "benchmarks/*.json"
      - "benchmarks/*.md"
      - "docs/data/*.json"
      - "docs/assets/benchmark-summary.svg"
      - "docs/benchmark-dashboard.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install locked site dependencies
        run: npm ci --prefix website --no-audit --no-fund

      - name: Build product site
        env:
          VITE_SOURCE_SHA: ${{ github.sha }}
        run: npm run build --prefix website

      - name: Assemble evidence library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p website/dist/evidence website/dist/benchmarks website/dist/data website/dist/assets
          cp website/dist/index.html website/dist/evidence/index.html
          cp docs/benchmark-dashboard.html website/dist/evidence/legacy.html
          cp docs/assets/benchmark-summary.svg website/dist/assets/benchmark-summary.svg
          find benchmarks -maxdepth 1 -type f -name '*.md' -exec cp '{}' website/dist/benchmarks/ ';'
          find benchmarks -maxdepth 1 -type f -name '*.json' -exec cp '{}' website/dist/data/ ';'
          find docs/data -maxdepth 1 -type f -name '*.json' -exec cp '{}' website/dist/data/ ';'
          touch website/dist/.nojekyll

      - name: Validate deploy bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s website/dist/index.html
          test -s website/dist/evidence/index.html
          test -s website/dist/evidence/legacy.html
          test -s website/dist/data/product-status.json
          test -s website/dist/data/leaderboard-status.json
          test -s website/dist/data/evaluation_validity_admission_results.json
          test -s website/dist/benchmarks/BENCHMARK_LEADERBOARD.md
          ! grep -R -E 'manus-storage|sonner|Connect this CTA' website/dist

      - name: Capture desktop and mobile previews
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p website/preview-root website/preview
          ln -s ../dist website/preview-root/wavemind
          python3 -m http.server 4173 --directory website/preview-root >/tmp/wavemind-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/wavemind/ >/dev/null && break
            sleep 0.25
          done
          "$browser" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --screenshot=website/preview/home-desktop.png http://127.0.0.1:4173/wavemind/
          "$browser" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=website/preview/home-mobile.png http://127.0.0.1:4173/wavemind/
          "$browser" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --screenshot=website/preview/evidence-desktop.png http://127.0.0.1:4173/wavemind/evidence/
          test "$(stat -c%s website/preview/home-desktop.png)" -gt 20000
          test "$(stat -c%s website/preview/home-mobile.png)" -gt 12000
          test "$(stat -c%s website/preview/evidence-desktop.png)" -gt 20000

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: product-site-preview
          path: |
            website/dist
            website/package-lock.json
            website/preview
          retention-days: 7

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy product site and evidence library
        id: deployment
        uses: actions/deploy-pages@v5
