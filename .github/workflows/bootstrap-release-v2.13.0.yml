name: bootstrap-release-v2.13.0

on:
  push:
    branches:
      - goal/competitive-admission-p0
    paths:
      - .github/workflows/bootstrap-release-v2.13.0.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: bootstrap-release-v2.13.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_TAG: v2.13.0
      TARGET_SHA: a23283123eb37b187a755db7ab4c4776555198d8
      SOURCE_BRANCH: goal/competitive-admission-p0
      BOOTSTRAP_PATH: .github/workflows/bootstrap-release-v2.13.0.yml
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Create the immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TARGET_TAG" --jq .object.sha 2>/dev/null || true)"
          if [ -n "$existing" ] && [ "$existing" != "$TARGET_SHA" ]; then
            echo "$TARGET_TAG already points to $existing, expected $TARGET_SHA" >&2
            exit 1
          fi
          if [ -z "$existing" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TARGET_TAG" \
              -f sha="$TARGET_SHA"
          fi

      - name: Dispatch exact-SHA Safe Product admission
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run safe-product.yml --ref "$TARGET_TAG"
          run_id=""
          for attempt in $(seq 1 30); do
            run_id="$(gh run list \
              --workflow safe-product.yml \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$TARGET_SHA\") | .databaseId" | head -n 1)"
            if [ -n "$run_id" ]; then
              break
            fi
            echo "Waiting for Safe Product run to appear ($attempt/30)"
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "Safe Product workflow did not start" >&2
            exit 1
          fi
          echo "SAFE_PRODUCT_RUN_ID=$run_id" >> "$GITHUB_ENV"
          gh run watch "$run_id" --exit-status --interval 30

      - name: Download exact-SHA admission evidence
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$SAFE_PRODUCT_RUN_ID" \
            --name "safe-product-admission-$TARGET_SHA" \
            --dir safe-product-evidence
          gh run download "$SAFE_PRODUCT_RUN_ID" \
            --name "workspace-experience-admission-$TARGET_SHA" \
            --dir workspace-experience-evidence

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate release identity and canonical product status
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          TAG_VERSION="${TARGET_TAG#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TARGET_TAG does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python scripts/sync_product_status.py --check

      - name: Validate release claim boundaries
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,bench]"
          python benchmarks/validate_benchmark_artifacts.py \
            --expected-source-sha "$TARGET_SHA" \
            --output "${RUNNER_TEMP}/benchmark-artifact-audit.json"
          python benchmarks/production_readiness_gate.py \
            --output "${RUNNER_TEMP}/production-readiness.json" \
            --markdown-output "${RUNNER_TEMP}/PRODUCTION_READINESS.md"
          python -m wavemind production-evidence-dispatch \
            --root "$GITHUB_WORKSPACE" \
            --write-artifacts \
            --output "${RUNNER_TEMP}/production-evidence-dispatch.json" \
            --markdown-output "${RUNNER_TEMP}/PRODUCTION_EVIDENCE_DISPATCH.md"
          python -m wavemind production-evidence-bundle \
            --root "$GITHUB_WORKSPACE" \
            --write-artifacts \
            --output "${RUNNER_TEMP}/production-evidence-bundle.json" \
            --markdown-output "${RUNNER_TEMP}/PRODUCTION_EVIDENCE_BUNDLE.md"
          python -m wavemind release-claims \
            --root "$GITHUB_WORKSPACE" \
            --write-artifacts \
            --fail-on-blocked \
            --output "${RUNNER_TEMP}/release-claims.json" \
            --markdown-output "${RUNNER_TEMP}/RELEASE_CLAIMS.md"
          python -m wavemind scale-gap \
            --root "$GITHUB_WORKSPACE" \
            --write-artifacts \
            --output "${RUNNER_TEMP}/scale-gap.json" \
            --markdown-output "${RUNNER_TEMP}/SCALE_GAP.md"

      - name: Build and verify distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Create the verified GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            echo "Release $TARGET_TAG already exists"
          else
            gh release create "$TARGET_TAG" \
              --verify-tag \
              --target "$TARGET_SHA" \
              --generate-notes \
              dist/* \
              safe-product-evidence/* \
              workspace-experience-evidence/*
          fi

      - name: Dispatch PyPI and GHCR publication
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run publish.yml --ref main -f tag="$TARGET_TAG"
          gh workflow run container.yml --ref "$TARGET_TAG"

      - name: Remove the temporary bootstrap workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          file_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$BOOTSTRAP_PATH?ref=$SOURCE_BRANCH" --jq .sha 2>/dev/null || true)"
          if [ -n "$file_sha" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$BOOTSTRAP_PATH" \
              -f message="chore: remove v2.13.0 release bootstrap" \
              -f sha="$file_sha" \
              -f branch="$SOURCE_BRANCH"
          fi
