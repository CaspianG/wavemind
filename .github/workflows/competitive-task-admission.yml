name: competitive task admission

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: competitive-task-admission-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  exact-sha-competitive-task-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install exact competitor versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install \
            chromadb==1.5.9 \
            fastembed==0.8.0 \
            langgraph==1.2.11 \
            mem0ai==2.0.18 \
            qdrant-client==1.19.0
          python -m pip check

      - name: Verify admission contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -q \
            tests/test_experience_compiler.py \
            tests/test_public_memory_competitors.py \
            tests/test_competitive_task_admission.py

      - name: Capture exact environment
        run: |
          python -m pip freeze > "${RUNNER_TEMP}/competitive-task-pip-freeze.txt"
          python -c 'import json, platform; print(json.dumps({"python": platform.python_version(), "platform": platform.platform(), "processor": platform.processor()}, indent=2))' > "${RUNNER_TEMP}/competitive-task-environment.json"

      - name: Run real task-native competitors
        run: |
          python -m benchmarks.competitive_task_benchmark \
            --source-sha "$GITHUB_SHA" \
            --repeats 5 \
            --output "${RUNNER_TEMP}/competitive-task-benchmark.json"

      - name: Enforce exact-SHA competitive admission
        run: |
          python -m benchmarks.competitive_task_admission \
            --benchmark "${RUNNER_TEMP}/competitive-task-benchmark.json" \
            --expected-source-sha "$GITHUB_SHA" \
            --output "${RUNNER_TEMP}/competitive-task-admission.json" \
            --markdown-output "${RUNNER_TEMP}/COMPETITIVE_TASK_ADMISSION.md" \
            --fail-on-blocked

      - name: Upload exact-SHA competitive evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: competitive-task-admission-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/competitive-task-pip-freeze.txt
            ${{ runner.temp }}/competitive-task-environment.json
            ${{ runner.temp }}/competitive-task-benchmark.json
            ${{ runner.temp }}/competitive-task-admission.json
            ${{ runner.temp }}/COMPETITIVE_TASK_ADMISSION.md
