name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  safe-product:
    uses: ./.github/workflows/safe-product.yml
    permissions:
      contents: read
      security-events: write

  build:
    needs: safe-product
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate release identity and canonical product status
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          python scripts/sync_product_status.py --check

      - name: Validate release claim boundaries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,bench]"
          python benchmarks/validate_benchmark_artifacts.py \
            --expected-source-sha "${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/benchmark-artifact-audit.json"
          python benchmarks/production_readiness_gate.py \
            --output "${RUNNER_TEMP}/production-readiness.json" \
            --markdown-output "${RUNNER_TEMP}/PRODUCTION_READINESS.md"
          python -m wavemind production-evidence-dispatch \
            --root "$GITHUB_WORKSPACE" \
            --write-artifacts \
            --output "${RUNNER_TEMP}/production-evidence-dispatch.json" \
            --markdown-output "${RUNNER_TEMP}/PRODUCTION_EVIDENCE_DISPATCH.md"
          python -m wavemind production-evidence-bundle \
            --root "$GITHUB_WORKSPACE" \
            --write-artifacts \
            --output "${RUNNER_TEMP}/production-evidence-bundle.json" \
            --markdown-output "${RUNNER_TEMP}/PRODUCTION_EVIDENCE_BUNDLE.md"
          python -m wavemind release-claims \
            --root "$GITHUB_WORKSPACE" \
            --write-artifacts \
            --fail-on-blocked \
            --output "${RUNNER_TEMP}/release-claims.json" \
            --markdown-output "${RUNNER_TEMP}/RELEASE_CLAIMS.md"
          python -m wavemind scale-gap \
            --root "$GITHUB_WORKSPACE" \
            --write-artifacts \
            --output "${RUNNER_TEMP}/scale-gap.json" \
            --markdown-output "${RUNNER_TEMP}/SCALE_GAP.md"

      - name: Build and verify the release candidate once
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: release-claim-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/benchmark-artifact-audit.json
            ${{ runner.temp }}/production-readiness.json
            ${{ runner.temp }}/PRODUCTION_READINESS.md
            ${{ runner.temp }}/production-evidence-dispatch.json
            ${{ runner.temp }}/PRODUCTION_EVIDENCE_DISPATCH.md
            ${{ runner.temp }}/production-evidence-bundle.json
            ${{ runner.temp }}/PRODUCTION_EVIDENCE_BUNDLE.md
            ${{ runner.temp }}/release-claims.json
            ${{ runner.temp }}/RELEASE_CLAIMS.md
            ${{ runner.temp }}/scale-gap.json
            ${{ runner.temp }}/SCALE_GAP.md

  github-release:
    needs: [safe-product, build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-distributions-${{ github.sha }}
          path: dist

      - uses: actions/download-artifact@v5
        with:
          name: safe-product-admission-${{ github.sha }}
          path: safe-product-evidence

      - uses: actions/download-artifact@v5
        with:
          name: workspace-experience-admission-${{ github.sha }}
          path: workspace-experience-evidence

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            safe-product-evidence/*
            workspace-experience-evidence/*
