name: safe-product

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: safe-product-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  compatibility:
    name: compatibility (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.13"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run compatibility and safe-default checks
        run: >-
          python -m pytest -q
          tests/test_core_persistence.py
          tests/test_cli_smoke.py::test_cli_serve_public_bind_is_explicit_and_authenticated
          tests/test_api.py::test_fastapi_principals_enforce_namespace_prefixes
          tests/test_onboarding.py::test_cli_init_and_doctor_json

  sast:
    name: sast (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  admission:
    name: exact-SHA admission
    needs: [compatibility, sast]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install admission dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,bench]"
          npm ci --prefix sdk/typescript

      - name: Build the exact candidate image
        run: docker build --build-arg INSTALL_PRODUCTION=true --tag "wavemind:safe-product-${GITHUB_SHA}" .

      - name: Generate exact-SHA component evidence
        run: |
          python benchmarks/safe_retrieval_admission.py \
            --output "${RUNNER_TEMP}/safe-retrieval.json" \
            --require-admitted
          python benchmarks/product_persistence_admission.py \
            --image "wavemind:safe-product-${GITHUB_SHA}" \
            --state-root "${RUNNER_TEMP}/persistence" \
            --output "${RUNNER_TEMP}/product-persistence.json"
          python benchmarks/quickstart_admission.py \
            --docker-image "wavemind:safe-product-${GITHUB_SHA}" \
            --temp-root "${RUNNER_TEMP}/quickstarts" \
            --output "${RUNNER_TEMP}/quickstarts.json"

      - name: Enforce Safe Product Admission
        run: |
          python benchmarks/safe_product_admission.py \
            --safe-retrieval "${RUNNER_TEMP}/safe-retrieval.json" \
            --product-persistence "${RUNNER_TEMP}/product-persistence.json" \
            --quickstarts "${RUNNER_TEMP}/quickstarts.json" \
            --ci-matrix-passed \
            --sast-passed \
            --output "${RUNNER_TEMP}/safe-product.json" \
            --markdown-output "${RUNNER_TEMP}/SAFE_PRODUCT_ADMISSION.md" \
            --require-admitted

      - name: Upload exact-SHA admission evidence
        uses: actions/upload-artifact@v7
        with:
          name: safe-product-admission-${{ github.sha }}
          path: |
            ${{ runner.temp }}/safe-retrieval.json
            ${{ runner.temp }}/product-persistence.json
            ${{ runner.temp }}/quickstarts.json
            ${{ runner.temp }}/safe-product.json
            ${{ runner.temp }}/SAFE_PRODUCT_ADMISSION.md

  workspace-experience:
    name: workspace-experience exact-SHA admission
    needs: admission
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install workspace admission dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,bench]"

      - uses: actions/download-artifact@v8
        with:
          name: safe-product-admission-${{ github.sha }}
          path: ${{ runner.temp }}/safe-product

      - name: Generate exact-current workspace operational evidence
        run: |
          python benchmarks/workspace_experience_operational_evidence.py \
            --output "${RUNNER_TEMP}/workspace-operational.json" \
            --temp-root "${RUNNER_TEMP}/workspace-operational" \
            --require-admitted

      - name: Enforce Workspace Experience Admission
        run: |
          python benchmarks/workspace_experience_admission.py \
            --safe-product "${RUNNER_TEMP}/safe-product/safe-product.json" \
            --operational-evidence "${RUNNER_TEMP}/workspace-operational.json" \
            --matrix-output "${RUNNER_TEMP}/workspace-experience-matrix.json" \
            --matrix-markdown-output "${RUNNER_TEMP}/WORKSPACE_EXPERIENCE_ADMISSION_MATRIX.md" \
            --output "${RUNNER_TEMP}/workspace-experience.json" \
            --markdown-output "${RUNNER_TEMP}/WORKSPACE_EXPERIENCE_ADMISSION.md" \
            --require-admitted

      - name: Upload exact-current Workspace Experience evidence
        uses: actions/upload-artifact@v7
        with:
          name: workspace-experience-admission-${{ github.sha }}
          path: |
            ${{ runner.temp }}/workspace-operational.json
            ${{ runner.temp }}/workspace-experience-matrix.json
            ${{ runner.temp }}/WORKSPACE_EXPERIENCE_ADMISSION_MATRIX.md
            ${{ runner.temp }}/workspace-experience.json
            ${{ runner.temp }}/WORKSPACE_EXPERIENCE_ADMISSION.md

  evaluation-validity:
    name: evaluation-validity exact-SHA admission
    needs: workspace-experience
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install evaluation admission dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,bench]"

      - uses: actions/download-artifact@v8
        with:
          name: safe-product-admission-${{ github.sha }}
          path: ${{ runner.temp }}/safe-product

      - uses: actions/download-artifact@v8
        with:
          name: workspace-experience-admission-${{ github.sha }}
          path: ${{ runner.temp }}/workspace-experience

      - name: Checkout pinned public evaluation sources
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/STATE-Bench.git "${RUNNER_TEMP}/STATE-Bench"
          git -C "${RUNNER_TEMP}/STATE-Bench" checkout --detach 5644b1838d96bc4483da29642d058ecaa6f80f7f
          git clone --filter=blob:none --no-checkout https://github.com/MemTensor/MemOps.git "${RUNNER_TEMP}/MemOps"
          git -C "${RUNNER_TEMP}/MemOps" checkout --detach 312af65e2c7b6d1b70f062ffa8b4cde32aaf6f35

      - name: Generate exact-SHA validity evidence
        run: |
          python benchmarks/evaluation_validity_controls.py \
            --output "${RUNNER_TEMP}/evaluation-controls.json" \
            --require-passed
          python benchmarks/evaluation_split_manifest.py \
            --state-bench-root "${RUNNER_TEMP}/STATE-Bench" \
            --memops-root "${RUNNER_TEMP}/MemOps" \
            --output "${RUNNER_TEMP}/evaluation-splits.json" \
            --require-valid
          python benchmarks/evaluation_judge_policy.py \
            --output "${RUNNER_TEMP}/evaluation-judges.json" \
            --require-valid

      - name: Enforce Evaluation Validity Admission
        run: |
          python benchmarks/evaluation_validity_admission.py \
            --validity-evidence "${RUNNER_TEMP}/evaluation-controls.json" \
            --split-evidence "${RUNNER_TEMP}/evaluation-splits.json" \
            --judge-evidence "${RUNNER_TEMP}/evaluation-judges.json" \
            --safe-product "${RUNNER_TEMP}/safe-product/safe-product.json" \
            --workspace-experience "${RUNNER_TEMP}/workspace-experience/workspace-experience.json" \
            --expected-source-sha "${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/evaluation-validity.json" \
            --markdown-output "${RUNNER_TEMP}/EVALUATION_VALIDITY_ADMISSION.md" \
            --require-admitted

      - name: Upload exact-current Evaluation Validity evidence
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-validity-admission-${{ github.sha }}
          path: |
            ${{ runner.temp }}/evaluation-controls.json
            ${{ runner.temp }}/evaluation-splits.json
            ${{ runner.temp }}/evaluation-judges.json
            ${{ runner.temp }}/evaluation-validity.json
            ${{ runner.temp }}/EVALUATION_VALIDITY_ADMISSION.md
