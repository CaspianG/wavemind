version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # MCP 2 changes the integration contract and needs a deliberate migration.
      - dependency-name: mcp
        versions: [">=2"]
      # Ruff 0.16 enables a large new rule surface and needs a dedicated cleanup.
      - dependency-name: ruff
        versions: [">=0.16"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # Action majors are reviewed as explicit infrastructure migrations.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    groups:
      typescript-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # The SDK currently supports the TypeScript 5 toolchain.
      - dependency-name: typescript
        versions: [">=6"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    groups:
      docker-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # The published image deliberately uses the Python 3.11 runtime line.
      - dependency-name: python
        versions: [">=3.12"]
